name: app_2sm
description: "2SM - Sports Space Management Application"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  equatable: ^2.0.7
  fl_chart: ^0.70.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  flutter_html: ^3.0.0-beta.2
  go_router: ^14.8.1
  json_annotation: ^4.12.0
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.24
  connectivity_plus: ^6.1.3
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.9.3
  drift_dev: ^2.22.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon_square.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/icon_square.png"
  windows:
    generate: true
    image_path: "assets/branding/icon_square.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/branding/icon_square.png"
  web:
    generate: true
    image_path: "assets/branding/icon_square.png"
    background_color: "#FFFFFF"
    theme_color: "#0B2540"
