name: app_2sm
description: "2SM - Sports Space Management Application"
publish_to: 'none'
version: 1.2.1+5

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  equatable: ^2.0.7
  fl_chart: ^0.70.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  flutter_html: ^3.0.0-beta.2
  go_router: ^14.8.1
  json_annotation: ^4.12.0
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.24
  connectivity_plus: ^6.1.3
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.9.3
  drift_dev: ^2.22.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
  # Polices de la charte 2SM, intÃ©grÃ©es (fonctionnent hors connexion)
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-400.ttf
        - asset: assets/fonts/Sora-600.ttf
          weight: 600
        - asset: assets/fonts/Sora-700.ttf
          weight: 700
        - asset: assets/fonts/Sora-800.ttf
          weight: 800
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
    - family: Saira Condensed
      fonts:
        - asset: assets/fonts/SairaCondensed-600.ttf
          weight: 600
        - asset: assets/fonts/SairaCondensed-700.ttf
          weight: 700
        - asset: assets/fonts/SairaCondensed-800.ttf
          weight: 800

flutter_launcher_icons:
  # Sources gÃ©nÃ©rÃ©es par Â« php artisan brand:build --flutter=../2sm-flutter Â» (2sm-laravel)
  android: true
  ios: true
  image_path: "assets/branding/2sm-icone-1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#061630"
  adaptive_icon_foreground: "assets/branding/2sm-icone-premier-plan.png"
  windows:
    generate: true
    image_path: "assets/branding/2sm-icone-arrondie-1024.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/branding/2sm-icone-arrondie-1024.png"
  web:
    generate: true
    image_path: "assets/branding/2sm-icone-1024.png"
    background_color: "#061630"
    theme_color: "#0B2540"
